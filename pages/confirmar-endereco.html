<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link
        rel="stylesheet"
      />
        <link rel="stylesheet" href="css/custom.css">
    </head>
    <body class="container pt-5">
        <div class="row">

            <div class="col-md-5 offset-md-1">
                <h1 class="">Endereço</h1>
                <div class="card card-body">

                    <label for="">CEP</label>
                    <input placeholder="Digite seu CEP" onblur="" type="text" name="" id="cep">
                    
                    <label for="">Logradouro</label>
                    <input placeholder="Digite um logradouro" type="text" name="" id="logradouro">

                    <label for="">Número</label>
                    <input placeholder="Digite um numeros" type="text" name="" id="numero"> 

                    <label for="">Bairro</label>
                    <input placeholder="Digite o bairro" type="text" name="" id="bairro">

                    <label for="">Cidade</label>
                    <input placeholder="Digite a cidade" type="text" name="" id="cidade">

                    <label for="">UF</label> 
                    <input placeholder="Digite o estado" class="mb-4" type="text" name="" id="uf">

                    <button class="btn btn-primary w-100 ">Enviar</button>



                </div>
            </div>
            <div class="col-md-5">
                <img src="../img/address.svg" width="100%" alt="">
            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="js/endereco.js"></script>
        <script src="../js/darkmode.js"></script>

    </body>
</html>
